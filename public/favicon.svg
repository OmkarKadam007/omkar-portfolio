<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Border Gradient: Cyan to Electric Indigo to Violet -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Monogram Gradient: Bright White to Icy Indigo -->
    <linearGradient id="monogramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Theme Squircle Base -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#0b0f19" stroke="url(#borderGlow)" stroke-width="2.5" />

  <!-- Active AI Pulse Dot -->
  <circle cx="50" cy="14" r="3" fill="#38bdf8" filter="url(#neon)" />

  <!-- Geometric Monogram "OK" -->
  <g filter="url(#neon)">
    <!-- Letter "O" -->
    <rect x="15" y="20" width="16" height="24" rx="8" fill="none" stroke="url(#monogramGrad)" stroke-width="4.5" />
    
    <!-- Letter "K" -->
    <line x1="37" y1="20" x2="37" y2="44" stroke="url(#monogramGrad)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="38" y1="32" x2="49" y2="20" stroke="url(#monogramGrad)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="38" y1="32" x2="49" y2="44" stroke="url(#monogramGrad)" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>